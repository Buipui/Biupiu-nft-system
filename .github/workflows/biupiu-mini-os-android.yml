name: Buipui Mini OS Android Federation CI

on:
  push:
    paths:
      - 'mini-os/android/**'
      - '.github/workflows/biupiu-mini-os-android.yml'
  pull_request:
    paths:
      - 'mini-os/android/**'
      - '.github/workflows/biupiu-mini-os-android.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        working-directory: mini-os/android
        run: gradle testDebugUnitTest --stacktrace

      - name: Debug APK build
        working-directory: mini-os/android
        run: gradle assembleDebug --stacktrace

      - name: Repository source sanity
        run: |
          test -f mini-os/android/app/src/main/java/com/biupiu/minios/federation/NetworkTransport.java
          test ! -f mini-os/android/federation/ExternalTransportAdapter.java
          grep -q 'com.squareup.okhttp3:okhttp' mini-os/android/app/build.gradle
          grep -q 'net.openid:appauth' mini-os/android/app/build.gradle
          grep -q 'com.apollographql.apollo:apollo-runtime' mini-os/android/app/build.gradle
          grep -q 'io.coil-kt.coil3:coil' mini-os/android/app/build.gradle
          grep -q 'org.jsoup:jsoup' mini-os/android/app/build.gradle
