name: Biupiu ML subsystem validation

on:
  push:
    paths:
      - 'software/rnd-os-ai/src/biupiu_ai/ml/**'
      - 'software/rnd-os-ai/src/global_language_translation.py'
      - 'software/rnd-os-ai/src/biupiu_ai/learning.py'
      - 'software/rnd-os-ai/tests/test_ml_subsystem.py'
      - '.github/workflows/ml-subsystem-validation.yml'
  pull_request:
    paths:
      - 'software/rnd-os-ai/src/biupiu_ai/ml/**'
      - 'software/rnd-os-ai/src/global_language_translation.py'
      - 'software/rnd-os-ai/src/biupiu_ai/learning.py'
      - 'software/rnd-os-ai/tests/test_ml_subsystem.py'
      - '.github/workflows/ml-subsystem-validation.yml'

jobs:
  ml-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run ML subsystem tests
        working-directory: software/rnd-os-ai
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_ml_subsystem.py
