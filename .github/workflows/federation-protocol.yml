name: Biupiu Federation Protocol Gate

on:
  push:
    branches: ["main"]
    paths:
      - "software/rnd-os-ai/**"
      - "research/BIUPIU-*FEDERATION*"
      - ".github/workflows/federation-protocol.yml"
  workflow_dispatch:

jobs:
  federation-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software/rnd-os-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Execute federation protocol core gates
        env:
          PYTHONPATH: src
        run: >
          python -m pytest -q
          tests/test_federation_registry.py
          tests/test_quantum_federation.py
          tests/test_quantum_providers.py
          tests/test_federated_backends.py
          tests/test_algorithm_suite.py
          tests/test_multilingual_protocol.py
          tests/test_federation_protocol.py
