name: Biupiu Java and Linux CI

on:
  workflow_dispatch:
  push:
    paths:
      - "packages/biupiu-rnd-os/**"
      - "research/BIUPIU-JAVA-LINUX-RESOURCE-INDEX-v1.0.md"
      - ".github/workflows/java-linux-ci.yml"
  pull_request:
    paths:
      - "packages/biupiu-rnd-os/**"
      - "research/BIUPIU-JAVA-LINUX-RESOURCE-INDEX-v1.0.md"
      - ".github/workflows/java-linux-ci.yml"

jobs:
  linux-node-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Linux and Java smoke
        run: |
          test "$(uname -s)" = "Linux"
          test -f packages/biupiu-rnd-os/src/linux.ts
          test -f packages/biupiu-rnd-os/src/java.ts
          java -version
          javac -version
