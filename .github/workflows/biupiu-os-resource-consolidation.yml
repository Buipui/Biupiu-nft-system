name: Biupiu OS Resource Consolidation

on:
  push:
    branches: [main]
    paths:
      - 'research/BIUPIU-OS-RESOURCE-CONSOLIDATION-GATE-29.*'
      - 'intelligence/BIUPIU-OS-RESOURCE-CONSOLIDATION-SMOKE.py'
      - 'core/**'
      - 'apps/**'
      - 'packages/**'
      - 'world/**'
      - 'intelligence/**'
  pull_request:
    paths:
      - 'research/BIUPIU-OS-RESOURCE-CONSOLIDATION-GATE-29.*'
      - 'intelligence/BIUPIU-OS-RESOURCE-CONSOLIDATION-SMOKE.py'
      - 'core/**'
      - 'apps/**'
      - 'packages/**'
      - 'world/**'
      - 'intelligence/**'
  workflow_dispatch:

jobs:
  repository-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidation smoke
        run: python intelligence/BIUPIU-OS-RESOURCE-CONSOLIDATION-SMOKE.py
      - name: Required core boundaries
        run: |
          test -f core/multilang/include/biupiu_abi.h
          test -f core/multilang/rust/biupiu_kernel_boundary/src/lib.rs
          test -f core/multilang/cpp/biupiu_native_contract.hpp
          test -f apps/android/app/src/main/java/com/biupiu/rndos/SharedContracts.kt
          test -f apps/android/app/src/main/java/com/biupiu/rndos/CapabilityRouter.kt
          test -f apps/shared/runtime/department-runtime.ts
          test -f intelligence/BIUPIU-SYSTEM-INTEGRITY-MANIFEST-v1.json
          test -f research/BIUPIU-HOUSEKEEPING-AND-GATE-RECONCILIATION-PROTOCOL-v1.0.md
