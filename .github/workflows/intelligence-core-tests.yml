name: intelligence-core-tests

on:
  push:
    paths:
      - "software/rnd-os-ai/**"
      - "research/BIUPIU-INTELLIGENCE-LEARNING-*"
      - "research/BIUPIU-INTELLIGENCE-ARCHITECTURE-*"
      - "research/BIUPIU-OPENAI-*"
      - ".github/workflows/intelligence-core-tests.yml"
  pull_request:
    paths:
      - "software/rnd-os-ai/**"
      - "research/BIUPIU-INTELLIGENCE-LEARNING-*"
      - "research/BIUPIU-INTELLIGENCE-ARCHITECTURE-*"
      - "research/BIUPIU-OPENAI-*"
      - ".github/workflows/intelligence-core-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run Intelligence tests
        working-directory: software/rnd-os-ai
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_learning.py tests/test_intelligence_core.py tests/test_ai23.py tests/test_ai24.py tests/test_ai25.py tests/test_ai26.py tests/test_ai27.py tests/test_openai_integration.py
