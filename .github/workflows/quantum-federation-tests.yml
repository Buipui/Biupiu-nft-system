name: Biupiu Quantum Federation Tests

on:
  push:
    paths:
      - "software/rnd-os-ai/src/biupiu_ai/quantum_federation.py"
      - "software/rnd-os-ai/tests/test_quantum_federation.py"
      - ".github/workflows/quantum-federation-tests.yml"
  workflow_dispatch:

jobs:
  quantum-contract-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software/rnd-os-ai
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run quantum federation contract tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_quantum_federation.py
