name: OPC UA Adapter Conformance

on:
  push:
    paths:
      - "tests/opcua_adapter.py"
      - "tests/test_opcua_adapter.py"
      - ".github/workflows/opcua-adapter.yml"
  pull_request:
    paths:
      - "tests/opcua_adapter.py"
      - "tests/test_opcua_adapter.py"
      - ".github/workflows/opcua-adapter.yml"
  workflow_dispatch:

jobs:
  opcua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest pytest-asyncio asyncua
      - name: Run OPC UA adapter safety tests
        run: python -m pytest tests/test_opcua_adapter.py
