name: Machine Capability Simulation Conformance

on:
  push:
    paths:
      - "schemas/**"
      - "tests/simulator_machine_capability.py"
      - "tests/test_machine_capability_simulation.py"
      - ".github/workflows/machine-capability-simulation.yml"
  pull_request:
    paths:
      - "schemas/**"
      - "tests/**"
      - ".github/workflows/machine-capability-simulation.yml"
  workflow_dispatch:

jobs:
  simulation-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check jsonschema pytest
      - name: Validate capability fixture
        run: python tests/validate_machine_capability.py schemas/fixtures/machine-capability-v1.0.example.json
      - name: Run deterministic simulation tests
        run: python -m pytest tests/test_machine_capability_simulation.py
