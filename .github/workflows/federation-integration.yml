name: Biupiu Federation Integration

on:
  workflow_dispatch:
  push:
    paths:
      - "software/rnd-os-ai/**"
      - "mini-os/**"
      - "packages/biupiu-rnd-os/**"
      - "dms/core/site-node/**"
      - "research/BIUPIU-FEDERATED-COMPUTE-MACHINE-TEST-v1.0.md"

jobs:
  main-os:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile software/rnd-os-ai/src/biupiu_ai/*.py
      - run: python -m pip install pytest
      - run: PYTHONPATH=software/rnd-os-ai/src pytest -q software/rnd-os-ai/tests/test_compute_federation.py software/rnd-os-ai/tests/test_federated_machine_runtime.py software/rnd-os-ai/tests/test_adapter_registry.py

  mini-os-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++17 -Wall -Wextra -Werror mini-os/cpp/federation_runtime.cpp mini-os/cpp/federation_contract.cpp -Imini-os/include -o mini-os-federation-test
      - run: ./mini-os-federation-test

  mini-os-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: cargo test --manifest-path mini-os/rust/Cargo.toml

  federation-transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes tsx packages/biupiu-rnd-os/src/federation-transport.test.ts
