name: Biupiu native semantic smoke

on:
  push:
    paths:
      - "software/rnd-os-ai/**"
      - "research/BIUPIU-NATIVE-CODING-PHILOSOPHY-AND-ENGINEERING-MATRIX-v1.0.md"
      - ".github/workflows/biupiu-native-semantic-smoke.yml"
  workflow_dispatch:

jobs:
  native-semantic-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Compile native AI Python
        run: python -m compileall -q software/rnd-os-ai/src
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run targeted authority and learning tests
        env:
          PYTHONPATH: software/rnd-os-ai/src
        run: |
          python -m pytest -q \
            software/rnd-os-ai/tests/test_authority_hierarchy.py \
            software/rnd-os-ai/tests/test_federation_authority_gate.py \
            software/rnd-os-ai/tests/test_learning_governance_semantics.py
