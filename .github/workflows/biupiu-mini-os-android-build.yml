name: Biupiu Mini OS Android build

on:
  push:
    branches: [main]
    paths:
      - "mini-os/android/**"
      - ".github/workflows/biupiu-mini-os-android-build.yml"
  pull_request:
    paths:
      - "mini-os/android/**"
      - ".github/workflows/biupiu-mini-os-android-build.yml"
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Mini OS build inputs
        working-directory: mini-os/android
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Compile Mini OS
        working-directory: mini-os/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Run Mini OS JVM tests
        working-directory: mini-os/android
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: biupiu-mini-os-debug-apk
          path: mini-os/android/app/build/outputs/apk/debug/*.apk
