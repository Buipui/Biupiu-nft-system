name: Biupiu Department Runtime
on:
  workflow_dispatch:
  push:
    paths: ["apps/shared/runtime/**","apps/android/**","apps/windows/**",".github/workflows/biupiu-department-runtime.yml"]
  pull_request:
    paths: ["apps/shared/runtime/**","apps/android/**","apps/windows/**",".github/workflows/biupiu-department-runtime.yml"]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m json.tool apps/shared/runtime/department-runtime-contract-v1.json >/dev/null
      - name: Verify department runtime targets
        run: |
          python - <<'PY'
          from pathlib import Path
          checks = {
              "apps/shared/runtime/department-runtime.ts": 'route === "RND_OS"',
              "apps/android/app/src/main/java/com/biupiu/rndos/DepartmentRuntime.kt": "@biupiu/smart-farming",
              "apps/windows/DepartmentRuntime.cs": "@biupiu/smart-metallurgy",
          }
          for path, marker in checks.items():
              text = Path(path).read_text(encoding="utf-8")
              assert marker in text, (path, marker)
          print("Department runtime target verification: PASS")
          PY
