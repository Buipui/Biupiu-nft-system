name: Biupiu Android Signing Gate

on:
  workflow_dispatch:
    inputs:
      system:
        description: Android system to sign
        required: true
        type: choice
        options: [apps/android, smart-farming/android, software/rnd-os-mobile]
      publish_artifact:
        description: Upload signed APK as a workflow artifact
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  signing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Validate signing secret presence
        env:
          KEYSTORE_B64: ${{ secrets.BIUPIU_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BIUPIU_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BIUPIU_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BIUPIU_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "Required signing secrets are present."
      - name: Materialise keystore ephemerally
        env:
          KEYSTORE_B64: ${{ secrets.BIUPIU_ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/biupiu-release.keystore"
          chmod 600 "$RUNNER_TEMP/biupui-release.keystore" 2>/dev/null || chmod 600 "$RUNNER_TEMP/biupiu-release.keystore"
      - name: Require committed Gradle wrapper
        working-directory: ${{ inputs.system }}
        run: |
          test -x ./gradlew
          ./gradlew --version
      - name: Remove ephemeral signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/biupiu-release.keystore"
