name: Biupiu AI-79 Linux Security Runtime Conformance
on:
  push:
    paths:
      - "intelligence/BIUPIU-AI79-LINUX-SECURITY-RUNTIME-CONFORMANCE.cpp"
      - ".github/workflows/biupiu-ai79-linux-security-runtime.yml"
  pull_request:
    paths:
      - "intelligence/BIUPIU-AI79-LINUX-SECURITY-RUNTIME-CONFORMANCE.cpp"
      - ".github/workflows/biupiu-ai79-linux-security-runtime.yml"
jobs:
  security-runtime:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -O2 intelligence/BIUPIU-AI79-LINUX-SECURITY-RUNTIME-CONFORMANCE.cpp -o /tmp/biupiu-ai79
      - name: Execute capability probes
        run: /tmp/biupiu-ai79
