name: Biupiu Security Gate

# Current main verification touch.

on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'research/BIUPIU-ANDROID-SECURITY-*'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'apps/android/**'
      - 'research/BIUPIU-ANDROID-SECURITY-*'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Validate Android security boundaries
        shell: python
        run: |
          from pathlib import Path
          import re

          manifest = Path("apps/android/app/src/main/AndroidManifest.xml").read_text()
          assert 'android:networkSecurityConfig="@xml/network_security_config"' in manifest
          assert 'android:usesCleartextTraffic="false"' in manifest
          assert 'android:allowBackup="false"' in manifest
          assert Path("apps/android/app/src/main/res/xml/network_security_config.xml").exists()
          assert Path("apps/android/app/src/main/res/xml/backup_rules.xml").exists()
          assert Path("apps/android/app/src/main/res/xml/data_extraction_rules.xml").exists()
          assert Path("apps/android/app/src/main/java/com/biupiu/rndos/BiupiuSecurityPolicy.kt").exists()

          workflow_path = Path(".github/workflows/biupiu-security-gate.yml")
          sha_pattern = re.compile(r"^.+@[0-9a-fA-F]{40}$")
          own_refs = []
          for line in workflow_path.read_text(errors="ignore").splitlines():
              stripped = line.strip()
              if stripped.startswith("uses:"):
                  own_refs.append(stripped.split(":", 1)[1].strip().split("#", 1)[0].strip())
          unpinned_own_refs = [ref for ref in own_refs if not sha_pattern.fullmatch(ref)]
          assert not unpinned_own_refs, f"Security gate has unpinned actions: {unpinned_own_refs}"

          repo_refs = []
          for p in Path(".github/workflows").glob("*.y*ml"):
              for line in p.read_text(errors="ignore").splitlines():
                  stripped = line.strip()
                  if stripped.startswith("uses:"):
                      ref = stripped.split(":", 1)[1].strip().split("#", 1)[0].strip()
                      repo_refs.append((str(p), ref))
          floating = [x for x in repo_refs if "@" in x[1] and not sha_pattern.fullmatch(x[1])]
          print(f"Repository workflow references observed: {len(repo_refs)}")
          print(f"Repository-wide non-SHA references reported (non-blocking migration inventory): {len(floating)}")
          if floating:
              for p, ref in floating[:50]:
                  print(f"NON_SHA {p} {ref}")

          for p in Path(".").rglob("*"):
              if not p.is_file() or ".git" in p.parts or p == workflow_path:
                  continue
              if p.suffix.lower() not in {".kt",".java",".kts",".gradle",".yml",".yaml",".properties",".json",".xml"}:
                  continue
              text = p.read_text(errors="ignore")
              assert "BEGIN PRIVATE KEY" not in text, p
              assert "BIUPIU_ANDROID_KEYSTORE_PASSWORD=" not in text, p

          print("Biupiu security static audit: PASS")
      - name: Configure verified Gradle action
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Run native Android security unit tests
        working-directory: apps/android
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Validate security manifest
        run: python -m json.tool research/BIUPIU-ANDROID-SECURITY-MANIFEST-v1.0.json >/dev/null
