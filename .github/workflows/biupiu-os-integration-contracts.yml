name: Biupiu OS Integration Contracts
on:
  push:
    paths: ["os/**"]
  pull_request:
    paths: ["os/**"]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Contract and regression tests
        run: python -m unittest discover -s os/tests -p "test_*.py"
