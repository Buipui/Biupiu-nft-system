name: VIS-NATIVE-11 Host Provider and GPU Validation

on:
  push:
    paths:
      - "core/visual-native/**"
      - ".github/workflows/vis-native-10.yml"
  pull_request:
    paths:
      - "core/visual-native/**"
      - ".github/workflows/vis-native-10.yml"
  workflow_dispatch:

jobs:
  native-visual:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan development package
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev
      - name: Configure
        run: cmake -S core/visual-native -B build/visual-native -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/visual-native --parallel
      - name: CTest
        working-directory: build/visual-native
        run: ctest --output-on-failure
      - name: Host probe smoke
        if: runner.os == 'Linux'
        working-directory: build/visual-native
        run: ./biupiu_native_host_probe_smoke
      - name: Provider validation smoke
        working-directory: build/visual-native
        run: ./biupiu_native_provider_validation_smoke
