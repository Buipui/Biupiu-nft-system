name: Biupiu P1 Native AI Tests

on:
  push:
    branches:
      - priority1-native-ai-20260921
  pull_request:
    branches:
      - main
      - priority1-native-ai-20260921
  workflow_dispatch:

jobs:
  p1-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install -r software/rnd-os-ai/requirements-dev.txt
      - name: Run P1 control-plane tests
        env:
          PYTHONPATH: software/rnd-os-ai/src
        run: python -m pytest -q software/rnd-os-ai/tests/test_priority1.py
