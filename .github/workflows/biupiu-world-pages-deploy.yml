name: Biupiu World Pages Deployment

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/biupiu-world-pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Biupiu World static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate web shell
        run: |
          test -f web/index.html
          test -f web/healthz.json
          test -f web/realtime-contract.json
          test -f web/observability-contract.json
          grep -q "Biupiu World" web/index.html
      - name: Stage site
        run: |
          mkdir -p _site
          cp -R web/. _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy Biupiu World to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
