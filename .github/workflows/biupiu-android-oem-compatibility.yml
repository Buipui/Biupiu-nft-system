name: Biupiu Android OEM Compatibility Gate

on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'apps/android/app/src/test/**'
      - 'docs/architecture/BIUPIU-FOREIGN-OEM-RESOURCE-HARVEST-GATE-28.md'
      - '.github/workflows/biupiu-android-oem-compatibility.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/biupiu-android-oem-compatibility.yml'
  workflow_dispatch:

jobs:
  android-build:
    name: Android compile + OEM contract smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit contract tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Debug APK build
        run: ./gradlew assembleDebug --stacktrace

  emulator-smoke:
    name: Android emulator smoke
    runs-on: ubuntu-latest
    needs: android-build
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Emulator boot + APK install smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.biupiu.rndos/.MainActivity
            adb shell pidof com.biupiu.rndos
            adb shell dumpsys activity activities | grep -q 'com.biupiu.rndos'
            adb shell am force-stop com.biupiu.rndos

  promotion-boundary:
    name: Record OEM promotion boundary
    runs-on: ubuntu-latest
    needs: [android-build, emulator-smoke]
    steps:
      - run: |
          echo "Android compile: TESTED when this workflow passes"
          echo "Baseline emulator smoke: TESTED when this workflow passes"
          echo "OEM-specific physical devices: PENDING"
          echo "Vendor HAL/blobs: PENDING and licence-controlled"
          echo "Promotion to VERIFIED requires real target-device evidence"
