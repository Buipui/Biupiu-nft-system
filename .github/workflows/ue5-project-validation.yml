name: Biupiu UE5 Project Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'projects/BiupiuAssetStudio/**'
      - 'software/unreal/**'
      - 'research/visual-assets/**'
      - '.github/workflows/ue5-project-validation.yml'
  pull_request:
    paths:
      - 'projects/BiupiuAssetStudio/**'
      - 'software/unreal/**'
      - 'research/visual-assets/**'
      - '.github/workflows/ue5-project-validation.yml'

permissions:
  contents: read

jobs:
  validate-ue5-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate UE5 project JSON
        shell: python
        run: |
          import json
          from pathlib import Path
          data = json.loads(Path('projects/BiupiuAssetStudio/BiupiuAssetStudio.uproject').read_text())
          assert data['FileVersion'] == 3
          assert any(m['Name'] == 'BiupiuAssetStudio' for m in data['Modules'])
          enabled = {p['Name'] for p in data['Plugins'] if p.get('Enabled')}
          required = {'ModelingToolsEditorMode', 'InterchangeEditor', 'EditorScriptingUtilities', 'MovieRenderPipeline'}
          assert required <= enabled, required - enabled
          print('UE5 project descriptor: PASS')

      - name: Validate UE5 metadata schemas
        shell: python
        run: |
          import json
          from pathlib import Path
          for name in ('ASSET-METADATA-SCHEMA-v1.0.json','ue5-visual-asset-bridge.schema.json'):
              json.loads(Path('software/unreal', name).read_text())
          print('UE5 metadata schemas: PASS')

      - name: Validate visual-asset bridge contract
        shell: python
        run: |
          import json
          from pathlib import Path
          schema = json.loads(Path('software/unreal/ue5-visual-asset-bridge.schema.json').read_text())
          assert schema['properties']['ue5']['properties']['engine_major']['const'] == 5
          visual = Path('research/visual-assets/biupiu-visual-asset-manifest.schema.json')
          assert visual.exists()
          json.loads(visual.read_text())
          print('Visual asset <-> UE5 bridge: PASS')

      - name: Validate C++ source scaffold
        shell: bash
        run: |
          test -s projects/BiupiuAssetStudio/Source/BiupiuAssetStudio/BiupiuAssetStudio.cpp
          test -s projects/BiupiuAssetStudio/Source/BiupiuAssetStudio/BiupiuAssetStudio.Build.cs
          test -s projects/BiupiuAssetStudio/Source/BiupiuAssetStudio.Target.cs
          test -s projects/BiupiuAssetStudio/Source/BiupiuAssetStudioEditor.Target.cs
          echo 'UE5 C++ scaffold presence: PASS'

      - name: Verify generated files are excluded
        shell: bash
        run: |
          grep -q '^Binaries/$' .gitignore
          grep -q '^Intermediate/$' .gitignore
          grep -q '^DerivedDataCache/$' .gitignore
          grep -q '^Saved/$' .gitignore
          echo 'UE5 generated-file safeguards: PASS'

      - name: Verify workstation boundary
        shell: bash
        run: |
          echo 'UE5/Visual Studio compilation and Asset Registry checks remain workstation gates.'
          echo 'This CI validates repository source/configuration only.'
