name: AI-34 Controlled Runtime Smoke Test

on:
  push:
    paths:
      - "intelligence/BIUPIU-AI34-RUNTIME-SMOKE-TEST.py"
      - "intelligence/BIUPIU-AI34-RUNTIME-SMOKE-LOG-2026-09-20.md"
      - ".github/workflows/ai34-runtime-smoke.yml"
      - "tests/simulator_machine_capability.py"
      - "schemas/fixtures/machine-capability-v1.0.example.json"
  pull_request:
    paths:
      - "intelligence/**"
      - "tests/**"
      - "schemas/**"
      - ".github/workflows/ai34-runtime-smoke.yml"
  workflow_dispatch:

jobs:
  ai34:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema pytest
      - name: Validate fixture
        run: python tests/validate_machine_capability.py schemas/fixtures/machine-capability-v1.0.example.json
      - name: Execute controlled smoke harness
        run: python intelligence/BIUPIU-AI34-RUNTIME-SMOKE-TEST.py
      - name: Execute existing deterministic regression
        run: python -m pytest tests/test_machine_capability_simulation.py
