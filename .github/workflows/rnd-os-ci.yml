name: Biupiu R&D OS CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'software/rnd-os/**'
      - '.github/workflows/rnd-os-ci.yml'
  pull_request:
    paths:
      - 'software/rnd-os/**'
      - '.github/workflows/rnd-os-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software/rnd-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
