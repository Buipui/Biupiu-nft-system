name: Biupiu Firefly TypeScript Gate

on:
  push:
    paths:
      - "packages/biupiu-firefly/**"
      - "packages/*/src/**"
      - "tsconfig.json"
      - "package.json"
      - ".github/workflows/biupiu-firefly-typecheck.yml"
  pull_request:
    paths:
      - "packages/biupiu-firefly/**"
      - "packages/*/src/**"
      - "tsconfig.json"
      - "package.json"
      - ".github/workflows/biupiu-firefly-typecheck.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build:packages
      - run: node packages/biupiu-firefly/smoke-test.mjs
      - run: node packages/biupiu-render-pipeline/blender-adapter.smoke.mjs
      - run: node packages/biupiu-render-pipeline/blender-output-gate.smoke.mjs
      - run: node packages/biupiu-render-pipeline/conversion-gate.smoke.mjs
