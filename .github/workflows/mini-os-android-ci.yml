name: Mini-OS Android Federation CI

on:
  pull_request:
    paths:
      - 'mini-os/android/**'
      - 'research/BIUPIU-AI-MULTIMEDIA-UI-FEDERATION-LITERATURE-REGISTER-2026-09-22.md'
      - '.github/workflows/mini-os-android-ci.yml'
  push:
    branches:
      - 'federation/ai-multimedia-ui-harvest-20260922'
    paths:
      - 'mini-os/android/**'
      - 'research/BIUPIU-AI-MULTIMEDIA-UI-FEDERATION-LITERATURE-REGISTER-2026-09-22.md'
      - '.github/workflows/mini-os-android-ci.yml'

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble Mini-OS debug APK
        working-directory: mini-os/android
        run: gradle --no-daemon :app:assembleDebug
