name: Biupiu Department Launch
on:
  workflow_dispatch:
  push:
    paths: ["apps/shared/runtime/**","apps/android/**","apps/windows/**",".github/workflows/biupiu-department-launch.yml"]
  pull_request:
    paths: ["apps/shared/runtime/**","apps/android/**","apps/windows/**",".github/workflows/biupiu-department-launch.yml"]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m json.tool apps/shared/runtime/department-launch-map-v1.json >/dev/null
      - run: |
          test -f apps/shared/runtime/department-launcher.ts
          test -f apps/android/app/src/main/java/com/biupiu/rndos/DepartmentLauncher.kt
          test -f apps/windows/DepartmentLauncher.cs
          grep -q '@biupiu/smart-farming' apps/shared/runtime/department-launch-map-v1.json
          grep -q '@biupiu/smart-metallurgy' apps/shared/runtime/department-launch-map-v1.json
          grep -q '@biupiu/rnd-os' apps/shared/runtime/department-launch-map-v1.json
