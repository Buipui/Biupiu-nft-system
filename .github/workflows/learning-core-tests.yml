name: Biupiu Learning Core Tests

on:
  push:
    paths:
      - "software/rnd-os-ai/src/biupiu_ai/**"
      - "software/rnd-os-ai/tests/**"
      - ".github/workflows/learning-core-tests.yml"
  workflow_dispatch:

jobs:
  learning-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software/rnd-os-ai
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Learning core
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_learning.py
      - name: Learning integration
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_learning_integration.py
      - name: Advanced learning algorithms
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_advanced_learning_algorithms.py
      - name: Algorithm suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_algorithm_suite.py
      - name: Federation registry
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_federation_registry.py
      - name: Quantum federation
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_quantum_federation.py
      - name: Federated backend adapters
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_federated_backends.py
