name: Biupiu World Deployment Readiness Gate

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/biupiu-world-deployment-readiness.yml'
  pull_request:
  workflow_dispatch:

jobs:
  readiness:
    name: Hosting deployment readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate required web surface
        run: |
          set -e
          for f in web/index.html web/healthz.json web/realtime-contract.json web/observability-contract.json web/biupiu-world-hosting-manifest.json web/BIUPIU-WORLD-HOSTING-TEST-PLAN-v1.0.md; do
            test -f "$f"
          done

      - name: Validate cross-contract consistency
        run: |
          node <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('web/biupiu-world-hosting-manifest.json','utf8'));
          const h = JSON.parse(fs.readFileSync('web/healthz.json','utf8'));
          const r = JSON.parse(fs.readFileSync('web/realtime-contract.json','utf8'));
          const o = JSON.parse(fs.readFileSync('web/observability-contract.json','utf8'));

          if (m.world !== 'Biupiu World') throw new Error('manifest world mismatch');
          if (m.healthPath !== '/healthz.json') throw new Error('health path mismatch');
          if (m.security.httpsRequired !== true) throw new Error('HTTPS requirement missing');
          if (m.security.clientIsNotAuthority !== true) throw new Error('client authority control missing');
          if (m.security.secretsInBrowser !== false) throw new Error('browser secret policy failed');
          if (h.status !== 'ok') throw new Error('health contract not ok');
          if (r.primary !== 'websocket') throw new Error('WebSocket is not primary realtime transport');
          if (r.clientMayNotAuthoritativelyMutateState !== true) throw new Error('realtime authority rule failed');
          if (o.clientSecretsAllowed !== false) throw new Error('observability secret policy failed');

          console.log('cross-contract consistency: PASS');
          NODE

      - name: Static shell integrity
        run: |
          grep -q '<title>Biupiu World</title>' web/index.html
          grep -q 'healthz.json' web/index.html
          ! grep -Eiq '(api[_-]?key|secret|private[_-]?key|password)[[:space:]]*[:=]' web/index.html
          echo 'static shell integrity: PASS'

      - name: Package integrity check
        run: |
          rm -rf _site biupiu-world-site.tar.gz
          mkdir -p _site
          cp -R web/. _site/
          tar -czf biupiu-world-site.tar.gz -C _site .
          test -s biupiu-world-site.tar.gz
          tar -tzf biupiu-world-site.tar.gz | grep -q '^./index.html$'
          tar -tzf biupiu-world-site.tar.gz | grep -q '^./healthz.json$'
          echo 'deployment package integrity: PASS'

      - name: Optional live hosting probe
        if: ${{ vars.BIUPIU_WORLD_BASE_URL != '' }}
        env:
          BIUPIU_WORLD_BASE_URL: ${{ vars.BIUPIU_WORLD_BASE_URL }}
          BIUPIU_WORLD_HEALTH_PATH: ${{ vars.BIUPIU_WORLD_HEALTH_PATH }}
        run: |
          set -e
          base="$BIUPIU_WORLD_BASE_URL"
          health="${BIUPIU_WORLD_HEALTH_PATH:-/healthz.json}"
          case "$base" in https://*) ;; *) echo "BASE_URL must use HTTPS"; exit 1;; esac
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-redirs 3 --output /tmp/health.json --dump-header /tmp/headers.txt "$base$health"
          node -e "const h=require('/tmp/health.json'); if(h.status!=='ok') throw new Error('live health status is not ok')"
          grep -Eiq '^strict-transport-security:' /tmp/headers.txt || { echo 'missing HSTS header'; exit 1; }
          echo 'live hosting probe: PASS'

      - name: Record external activation boundary
        run: |
          echo 'Repository readiness checks: EXECUTED BY CI'
          echo 'External hosting activation: requires a configured provider/domain'
          echo 'No live deployment is promoted to VERIFIED without a successful live probe'
