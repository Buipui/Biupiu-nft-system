name: Biupiu Math Geometry Gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "codex/math/**"
      - "codex/geometry/**"
      - ".github/workflows/biupiu-math-geometry-gate.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall -q codex/math codex/geometry
      - name: Install test runner
        run: python -m pip install pytest
      - name: Test dependency-light math and geometry
        env:
          PYTHONPATH: .
        run: python -m pytest -q codex/geometry/tests codex/math/tests
