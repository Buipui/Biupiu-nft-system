name: Biupiu Math Geometry Gate

on:
  push:
    paths:
      - "codex/math/**"
      - "codex/geometry/**"
      - "research/BIUPIU-MATH-**"
  pull_request:
    paths:
      - "codex/math/**"
      - "codex/geometry/**"
      - "research/BIUPIU-MATH-**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile core Python
        run: python -m compileall -q codex/math codex/geometry
      - name: Run dependency-light tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q codex/geometry/tests codex/math/tests
