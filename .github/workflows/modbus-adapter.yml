name: Modbus Adapter Conformance

on:
  push:
    paths:
      - "tests/modbus_adapter.py"
      - "tests/test_modbus_adapter.py"
      - ".github/workflows/modbus-adapter.yml"
  pull_request:
    paths:
      - "tests/modbus_adapter.py"
      - "tests/test_modbus_adapter.py"
      - ".github/workflows/modbus-adapter.yml"
  workflow_dispatch:

jobs:
  modbus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest pymodbus
      - name: Run Modbus adapter safety tests
        run: python -m pytest tests/test_modbus_adapter.py
