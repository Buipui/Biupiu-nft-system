name: Biupiu Systemwide Module Audit
on:
  push:
    branches: [main]
    paths: ["apps/**","packages/**","software/**","dms/**","world/**","intelligence/**","research/**","docs/architecture/**",".github/workflows/biupiu-systemwide-module-audit.yml"]
  pull_request:
    paths: ["apps/**","packages/**","software/**","dms/**","world/**","intelligence/**","research/**",".github/workflows/biupiu-systemwide-module-audit.yml"]
  workflow_dispatch:
jobs:
  source-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python intelligence/BIUPIU-SYSTEMWIDE-MODULE-SMOKE-AUDIT.py
      - run: python intelligence/BIUPIU-NATIVE-SEMANTIC-CODE-AUDIT.py
      - run: python intelligence/BIUPIU-BLOCKCHAIN-ANCHOR-BOUNDARY.py
      - run: python intelligence/BIUPIU-AI-CODING-HARD-GATE.py
      - run: python intelligence/test_ai_coding_hard_gate.py
  npm-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install --no-audit --no-fund
      - run: npm run build:packages
      - run: npm run compile
      - run: npm test
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.9"}
      - run: |
          test -f mini-os/android/apps/rnd-os/settings.gradle.kts
          test -f mini-os/android/apps/rnd-os/build.gradle.kts
          test -f mini-os/android/apps/rnd-os/app/build.gradle.kts
          test -f mini-os/android/apps/rnd-os/gradle/wrapper/gradle-wrapper.properties
      - working-directory: mini-os/android/apps/rnd-os
        run: gradle --no-daemon :app:assembleDebug
      - working-directory: mini-os/android/apps/rnd-os
        run: gradle --no-daemon :app:testDebugUnitTest
