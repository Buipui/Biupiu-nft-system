## Fixes implemented
- Added game-engine and ECS providers to the native adapter registry.
- Added registry routing regression checks.
- Hardened mini-OS compute selection: higher capability classes satisfy lower minimum floors; preferred capability is selected only when admissible; ties are deterministic by capacity then unit ID.
- Added regression cases for capability floors and invalid lower preference.
- Preserved fail-closed promotion.

