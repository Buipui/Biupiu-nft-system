# Biupiu Game-Engine Federation External Harvest v1.3
Date: 2026-09-22
Status: SOURCE-HARVESTED / ARCHITECTURE-INTEGRATED / EXECUTION-GATED

## Integration rule
External engines are providers behind Biupiu contracts. They are not copied into the OS core and never become authority owners. The native path is:
CAPABILITY DISCOVERY -> LICENSE/PROVENANCE -> ADAPTER -> SANDBOX/RUNTIME -> TEST -> REGRESSION -> RUNTIME -> PROMOTION.

## Provider registry
- Cocos2d-x: scene graph, 2D renderer, sprites, physics, audio, input, particles, tilemaps.
- Cocos Creator Engine: 2D/3D renderer, PBR/materials, physics, UI, animation, audio, resources.
- MonoGame: framework, content pipeline, importers/processors, graphics/audio/input, localization.
- libGDX: Android/desktop/headless/GWT backends, Box2D, Bullet, FreeType, tools.
- Ashley ECS: entity/component/system/family-query.
- raylib: rlgl, raymath, audio, models/materials, shaders, VR.
- three.js: WebGL/WebGPU, controls, loaders, postprocessing, animation.
- GDevelop: event system, behaviors, extensions, 2D/3D, multiplayer.
- Babylon.js: core, GUI, loaders, materials, postprocess, physics, inspector.
- Everest/Celeste: mod-loader/API, plugin discovery, dependency isolation; reference-only.

## Missing-module findings
1. Asset/content pipeline: add a Biupiu asset-provider contract instead of adopting engine-specific binary formats.
2. Renderer abstraction: explicit backend capability/feature discovery.
3. Physics: provider-neutral Box2D/Bullet/engine-physics boundary.
4. ECS: stable world/query/component contract.
5. Web engines: explicit sandbox boundary; no OS authority.
6. Managed/JVM engines: optional runtime packaging; never a boot dependency.
7. Input: normalized device capabilities and deterministic event timestamps.
8. Audio: common lifecycle/focus contract and provider isolation.
9. Asset import/export: provenance, hashes, schema/version and licence metadata.
10. Mod/plugin discovery: quarantine, dependency graph validation and capability restrictions.

